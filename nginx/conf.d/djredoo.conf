# --- gemeinsame Proxy-Header ---
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_http_version 1.1;

# =================== Statische Website: dj-redoo.de ===================
server {
    listen 80;
    server_name dj-redoo.de;

    limit_req zone=general burst=20 nodelay;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    root /usr/share/nginx/site;
    index index.html;

    # Assets lange cachen, HTML kurz
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt/sitemap.xml: kurz cachen, damit Aenderungen zeitnah greifen
    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # live.html bindet die Wishlist von app.dj-redoo.de per iframe ein —
    # eigene CSP mit frame-src, sonst blockiert default-src 'self' das Embed.
    # QR-Code zeigt auf /live (ohne .html), daher beide Locations gleich.
    location ~ ^/live(\.html)?$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://app.dj-redoo.de; base-uri 'self'; object-src 'none'" always;
        try_files /live.html =404;
    }

    # index.html (One-Pager) bindet das Buchungsformular von app.dj-redoo.de
    # per iframe ein — eigene CSP mit frame-src, analog /live.
    location = / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://app.dj-redoo.de; base-uri 'self'; object-src 'none'" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ======================= dj-manage: app.dj-redoo.de ===================
server {
    listen 80;
    server_name app.dj-redoo.de;

    limit_req zone=general burst=20 nodelay;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # script-src 'unsafe-inline': Templates nutzen durchgehend Inline-Skripte/onclick
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://i.scdn.co https://*.spotifycdn.com; connect-src 'self' https://api.spotify.com https://nominatim.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Oeffentliche Seiten: Einbettung per iframe von dj-redoo.de erlaubt.
    # Achtung: add_header in location ersetzt ALLE Server-Level-Header,
    # daher hier komplett wiederholt; proxy_hide_header entfernt Djangos
    # eigenes X-Frame-Options.
    location ~ ^/(buchen/)?$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://i.scdn.co https://*.spotifycdn.com; connect-src 'self' https://api.spotify.com https://nominatim.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors *; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        proxy_hide_header X-Frame-Options;
        proxy_pass http://web:8000;
    }

    location = /admin/login/ {
        limit_req zone=login burst=3;
        proxy_pass http://web:8000;
    }

    location = /api/wish/          { limit_req zone=api_write burst=5; proxy_pass http://web:8000; }
    location = /api/submit-event/  { limit_req zone=api_write burst=5; proxy_pass http://web:8000; }
    location = /api/check-date/    { limit_req zone=api_write burst=5; proxy_pass http://web:8000; }

    location / {
        proxy_pass http://web:8000;
    }
}
