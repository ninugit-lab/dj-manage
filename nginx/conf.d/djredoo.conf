# --- gemeinsame Proxy-Header ---
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_http_version 1.1;

# =================== Statische Website: dj-redoo.de ===================
server {
    listen 80;
    server_name dj-redoo.de;

    limit_req zone=general burst=20 nodelay;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    root /usr/share/nginx/site;
    index index.html;

    # Assets lange cachen, HTML kurz
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ======================= dj-manage: app.dj-redoo.de ===================
server {
    listen 80;
    server_name app.dj-redoo.de;

    limit_req zone=general burst=20 nodelay;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://i.scdn.co https://*.spotifycdn.com; connect-src 'self' https://api.spotify.com https://nominatim.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /admin/login/ {
        limit_req zone=login burst=3;
        proxy_pass http://web:8000;
    }

    location = /api/wish/          { limit_req zone=api_write burst=5; proxy_pass http://web:8000; }
    location = /api/submit-event/  { limit_req zone=api_write burst=5; proxy_pass http://web:8000; }
    location = /api/check-date/    { limit_req zone=api_write burst=5; proxy_pass http://web:8000; }

    location / {
        proxy_pass http://web:8000;
    }
}
