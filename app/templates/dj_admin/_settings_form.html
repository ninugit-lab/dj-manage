{% comment %}
Partial: Quick Wishlist Settings Form.
Checkboxen verwenden label-wrapping (kein id= auf Inputs) → sicher bei Mehrfach-Include.
{% endcomment %}
<form method="post" action="{% url 'dj_admin:event_edit' pk=active_event.pk %}" class="m-0">
  {% csrf_token %}
  <input type="hidden" name="name" value="{{ active_event.name }}">
  <input type="hidden" name="date" value="{{ active_event.date|date:'Y-m-d' }}">
  <input type="hidden" name="location" value="{{ active_event.location }}">
  <input type="hidden" name="status" value="{{ active_event.status }}">
  <input type="hidden" name="is_active" value="on">
  <input type="hidden" name="spotify_playlist_id" value="{{ active_event.spotify_playlist_id }}">

  <div class="form-group">
    <label class="form-label flex flex-col gap-1 max-w-[160px]">
      <span>Max. Wünsche pro Session</span>
      <input type="number" name="max_wishes_per_session" class="form-input max-w-[100px]"
             value="{{ active_event.max_wishes_per_session }}" min="1">
    </label>
  </div>

  <div class="flex flex-col gap-1 mb-3">
    <label class="flex items-center gap-3 min-h-[44px] cursor-pointer select-none">
      <input type="checkbox" name="wishlist_show_cover" class="w-4 h-4" {% if active_event.wishlist_show_cover %}checked{% endif %}>
      <span>Cover</span>
    </label>
    <label class="flex items-center gap-3 min-h-[44px] cursor-pointer select-none">
      <input type="checkbox" name="wishlist_show_artist" class="w-4 h-4" {% if active_event.wishlist_show_artist %}checked{% endif %}>
      <span>Künstler</span>
    </label>
    <label class="flex items-center gap-3 min-h-[44px] cursor-pointer select-none">
      <input type="checkbox" name="wishlist_show_preview" class="w-4 h-4" {% if active_event.wishlist_show_preview %}checked{% endif %}>
      <span>Preview</span>
    </label>
    <label class="flex items-center gap-3 min-h-[44px] cursor-pointer select-none">
      <input type="checkbox" name="wishlist_show_duration" class="w-4 h-4" {% if active_event.wishlist_show_duration %}checked{% endif %}>
      <span>Dauer</span>
    </label>
    <label class="flex items-center gap-3 min-h-[44px] cursor-pointer select-none">
      <input type="checkbox" name="wishlist_require_name" class="w-4 h-4" {% if active_event.wishlist_require_name %}checked{% endif %}>
      <span>Name Pflicht</span>
    </label>
    <label class="flex items-center gap-3 min-h-[44px] cursor-pointer select-none">
      <input type="checkbox" name="wishlist_show_played" class="w-4 h-4" {% if active_event.wishlist_show_played %}checked{% endif %}>
      <span>Gespielte zeigen</span>
    </label>
    <label class="flex items-center gap-3 min-h-[44px] cursor-pointer select-none">
      <input type="checkbox" name="spotify_remove_on_played" class="w-4 h-4" {% if active_event.spotify_remove_on_played %}checked{% endif %}>
      <span>Gespielt → aus Spotify entfernen</span>
    </label>
  </div>

  <button type="submit" class="btn btn-ghost btn-sm min-h-[44px]">💾 Speichern</button>
</form>
