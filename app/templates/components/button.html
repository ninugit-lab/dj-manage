{% comment %} include: variant(primary|purple|danger|ghost) label type href aria_label onclick extra {% endcomment %}
{% with v=variant|default:"primary" %}
{% if href %}
<a href="{{ href }}" class="btn-{{ v }} {{ extra }}"{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}{% if onclick %} onclick="{{ onclick }}"{% endif %}>{{ label }}</a>
{% else %}
<button type="{{ type|default:'button' }}" class="btn-{{ v }} {{ extra }}"{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}{% if onclick %} onclick="{{ onclick }}"{% endif %}>{{ label }}</button>
{% endif %}
{% endwith %}
